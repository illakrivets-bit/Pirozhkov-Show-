name: Build ARTUR.APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Download approved tuxedo portrait
        run: |
          curl -L --fail --retry 3 "https://celebbio.org/wp-content/uploads/2022/12/pirozhkov-atrur-foto-07.jpg" -o www/artur-avatar.jpg
          magick www/artur-avatar.jpg -auto-orient -gravity center -crop 1:1 +repage -resize 512x512^ -gravity center -extent 512x512 www/icon-512.png

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Create Android launcher icons
        run: |
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            magick www/artur-avatar.jpg -auto-orient -gravity center -crop 1:1 +repage -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare ARTUR.APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/ARTUR.APK

      - name: Upload ARTUR.APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTUR.APK
          path: release/ARTUR.APK
          if-no-files-found: error
          retention-days: 30
